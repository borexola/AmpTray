name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  # Every push, pull request and tag runs the unit tests first, on both platforms. The packaging
  # job below depends on them, so a release can only be published when the tests pass.
  test:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run tests (core and app)
        shell: pwsh
        run: dotnet test AmpTray.slnx -c Release --nologo --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-windows
          path: artifacts/test-results/*.trx
          if-no-files-found: error

  # The core and the headless monitor on Linux: tests, then the self-contained tarballs.
  linux:
    name: Linux tests and tarballs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run core tests
        run: dotnet test tests/AmpTray.Core.Tests/AmpTray.Core.Tests.csproj -c Release --nologo --logger trx --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-linux
          path: artifacts/test-results/*.trx
          if-no-files-found: error

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
          else
            v="0.0.1-ci.${{ github.run_number }}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Build tarballs (linux-x64, linux-arm64)
        run: ./build/build-linux.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v6
        with:
          name: AmpTray-${{ steps.ver.outputs.version }}-linux
          path: artifacts/out/*.tar.gz
          if-no-files-found: error

  build:
    name: Build and release
    needs: [test, linux]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $ref = '${{ github.ref }}'
          if ($ref -like 'refs/tags/v*') {
            $v = $ref.Substring('refs/tags/v'.Length)
          } else {
            $v = "0.0.1-ci.${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build, zip and MSI
        shell: pwsh
        run: ./build/build.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@v6
        with:
          name: AmpTray-${{ steps.ver.outputs.version }}
          path: artifacts/out/*
          if-no-files-found: error

      # The Linux tarballs join the MSI and the zip in the release.
      - name: Fetch the Linux tarballs
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v6
        with:
          name: AmpTray-${{ steps.ver.outputs.version }}-linux
          path: artifacts/out

      # The release text is the annotated tag's message: short and written by hand.
      - name: Release notes from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
          $notes = git tag -l --format='%(contents)' '${{ github.ref_name }}'
          if (-not $notes) { $notes = "AmpTray ${{ steps.ver.outputs.version }}" }
          Set-Content -Path artifacts/notes.md -Value $notes -Encoding utf8

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: AmpTray ${{ steps.ver.outputs.version }}
          files: artifacts/out/*
          body_path: artifacts/notes.md
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}
